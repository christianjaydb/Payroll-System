<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Payroll Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F4;
    --surface:#FFFFFF;
    --ink:#222222;
    --ink-soft:#6B6B6B;
    --ink-faint:#9A9A9A;
    --border:#E1E1DF;
    --accent:#3D3D3D;
    --accent-ink:#1C1C1C;
    --accent-soft:#ECECEA;
    --danger:#AE4038;
    --danger-soft:#F6E7E5;
    --warn:#8A6D1E;
    --warn-soft:#F5EEDC;
    --c-blue:#3B6E91; --c-blue-soft:#E9F1F6;
    --c-green:#3F7D58; --c-green-soft:#E9F4EE;
    --c-amber:#B9822E; --c-amber-soft:#F8EFDF;
    --c-plum:#7C4A76; --c-plum-soft:#F4E9F2;
    --radius:6px;
    --shadow:none;
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);}
  body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Poppins",sans-serif;margin:0;font-weight:600;color:var(--ink);}
  button{font-family:inherit;font-size:14px;cursor:pointer;}
  input,select{font-family:inherit;font-size:14px;}
  a{color:inherit;}
  .tabular{font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px 32px;}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .brand .mark{width:10px;height:10px;background:var(--accent);border-radius:2px;display:inline-block;transform:translateY(-1px);}
  .brand h1{font-size:24px;}
  .login-card p.sub{color:var(--ink-soft);margin:2px 0 28px 0;font-size:13px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);border:1px solid transparent;font-weight:600;font-size:13.5px;transition:background .12s ease;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-primary:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
  .btn-block{width:100%;}
  .btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--ink);}
  .btn-secondary:hover{background:var(--bg);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#8f322c;}
  .btn-ghost{background:transparent;border:1px solid transparent;color:var(--ink-soft);padding:6px 10px;}
  .btn-ghost:hover{background:var(--bg);color:var(--ink);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .login-error{background:var(--danger-soft);color:var(--danger);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:16px;}
  .demo-hint{margin-top:24px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-faint);}
  .demo-hint code{background:var(--bg);padding:1px 5px;border-radius:4px;}
  .password-wrap{position:relative;}
  .password-wrap input{padding-right:44px;}
  .toggle-pw{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:4px;display:flex;align-items:center;justify-content:center;}
  .toggle-pw:hover{background:var(--bg);color:var(--ink);}
  .toggle-pw svg{width:18px;height:18px;display:block;}
  .forgot-link-row{text-align:center;margin-top:14px;}
  .forgot-link-row a{font-size:12.5px;color:var(--ink-soft);text-decoration:underline;}
  .forgot-link-row a:hover{color:var(--ink);}
  .forgot-note{display:none;margin-top:12px;font-size:12.5px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;text-align:center;}
  .forgot-note.show{display:block;}
  .print-row{display:flex;justify-content:flex-end;margin-top:12px;}

  /* ---------- Shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;transition:transform .18s ease;z-index:40;}
  .sidebar-head{padding:22px 20px 18px 20px;border-bottom:1px solid var(--border);}
  .sidebar-head .brand h1{font-size:19px;}
  .sidebar-head .role-pill{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:10px;}
  nav.nav-list{padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);color:var(--ink-soft);font-size:13.5px;font-weight:500;margin-bottom:2px;}
  .nav-item:hover{background:var(--bg);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
  .sidebar-foot{padding:14px 16px;border-top:1px solid var(--border);}
  .user-chip{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .user-chip .name{font-size:13px;font-weight:600;line-height:1.2;}
  .user-chip .sub{font-size:11.5px;color:var(--ink-faint);}

  .main{margin-left:220px;flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
  .hamburger{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .hamburger span{width:16px;height:2px;background:var(--ink);display:block;}
  .content{padding:26px 32px 60px 32px;max-width:1080px;width:100%;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .page-head h2{font-size:22px;}
  .page-head p{color:var(--ink-soft);margin:4px 0 0 0;font-size:13px;}
  .overlay{position:fixed;inset:0;background:rgba(20,26,20,.35);z-index:35;display:none;}
  .overlay.show{display:block;}

  /* ---------- Cards / stats ---------- */
  .stat-grid{margin-bottom:28px;}
  .ledger-strip{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .ledger-stat{flex:1 1 200px;padding:20px 26px;position:relative;border-left:1px solid var(--border);}
  .ledger-stat:first-child{border-left:none;}
  .ledger-stat.clickable{cursor:pointer;transition:background .12s ease;}
  .ledger-stat.clickable:hover{background:var(--bg);}
  .ledger-label{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .ledger-figure{font-family:"Source Serif 4",Georgia,serif;font-size:29px;font-weight:600;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;}
  .ledger-sub{font-size:12px;color:var(--ink-faint);margin-top:8px;}
  .ledger-delta{font-size:12px;margin-top:8px;font-weight:600;}
  .ledger-delta.up{color:var(--c-green);}
  .ledger-delta.down{color:var(--danger);}
  @media (max-width:640px){
    .ledger-stat{flex:1 1 100%;border-left:none !important;}
    .ledger-stat:not(:first-child){border-top:1px solid var(--border);margin-top:0;}
  }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .panel h3{font-size:15px;margin-bottom:14px;}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap.swipeable{cursor:grab;}
  .table-wrap.swipeable.dragging{cursor:grabbing;}
  .table-wrap.dragging, .table-wrap.dragging *{user-select:none;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  /* Row-action colors for Payroll History — reuse the same muted palette already used for
     holiday badges elsewhere, so these read as an intentional set rather than random color. */
  .btn-ghost-blue{color:var(--c-blue);}
  .btn-ghost-blue:hover{background:var(--c-blue-soft);color:var(--c-blue);}
  .btn-ghost-green{color:var(--c-green);}
  .btn-ghost-green:hover{background:var(--c-green-soft);color:var(--c-green);}
  .btn-ghost-amber{color:var(--c-amber);}
  .btn-ghost-amber:hover{background:var(--c-amber-soft);color:var(--c-amber);}
  .btn-ghost-plum{color:var(--c-plum);}
  .btn-ghost-plum:hover{background:var(--c-plum-soft);color:var(--c-plum);}
  .status-pill{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;display:inline-block;}
  .status-active{background:var(--accent-soft);color:var(--accent-ink);}
  .status-leave{background:var(--warn-soft);color:var(--warn);}
  .status-inactive{background:var(--danger-soft);color:var(--danger);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
  tr[data-view-pr], tr.clickable-row{cursor:pointer;}
  tr[data-view-pr]:hover, tr.clickable-row:hover{background:var(--bg);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;justify-content:space-between;}
  .toolbar .filters{display:flex;gap:10px;flex-wrap:wrap;}
  .toolbar input[type=text],.toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);min-width:150px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,26,20,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-backdrop.show{display:flex;}
  .modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .span-2{grid-column:1/-1;}
  .calc-preview{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:4px;}
  .calc-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-soft);}
  .calc-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:9px;font-weight:700;color:var(--ink);font-size:15px;}

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{padding:12px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:220px;}
  .toast-success{background:var(--accent-ink);color:#fff;}
  .toast-error{background:var(--danger);color:#fff;}

  .payslip{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .payslip-head{background:var(--bg);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .payslip-row{display:flex;justify-content:space-between;padding:9px 18px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .payslip-row:last-child{border-bottom:none;}
  .payslip-row.net{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:15px;}

  /* ---------- Holiday badges / entries ---------- */
  .holiday-badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;display:inline-block;white-space:nowrap;}
  .holiday-badge-regular{background:var(--c-blue-soft);color:var(--c-blue);}
  .holiday-badge-special_non_working{background:var(--c-amber-soft);color:var(--c-amber);}
  .holiday-badge-special_working{background:var(--c-plum-soft);color:var(--c-plum);}
  .holiday-entry-row{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--bg);}
  .holiday-entry-row .form-grid{grid-template-columns:1.4fr 0.9fr 0.9fr 1.1fr 0.6fr;align-items:end;margin-bottom:0;}
  .holiday-entry-row .field{margin-bottom:0;}
  @media (max-width:860px){ .holiday-entry-row .form-grid{grid-template-columns:1fr 1fr;} }
  .holiday-entries-empty{color:var(--ink-soft);font-size:13px;padding:10px 2px;}
  .holiday-mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .holiday-mini-table th{text-align:left;font-size:10.5px;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--border);}
  .holiday-mini-table td{padding:7px 8px;border-bottom:1px solid var(--border);}

  @media (max-width: 860px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:20px 16px 50px 16px;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-wrap"></div>

<script>
/* ============================================================
   DATA LAYER
============================================================ */
const STORAGE_KEY = "ledgerPayrollDB_v5";

function defaultSettings(){
  return {
    companyName: "Ledger Philippines Inc.",
    companyAddress: "8th Floor, Ayala Tower One, Ayala Avenue, Makati City, Metro Manila",
    dailyWorkingHours: 8,
    workingDaysPerYear: 261,       // used to derive daily rate from monthly salary
    otMultiplier: 1.25,            // 125% of hourly rate
    nsdRate: 0.10,                 // 10% additional pay
    payrollCutoff: "1st–15th and 16th–end of month",
    payDate: "Every 15th and last working day of the month",
    // Employer-only SSS Employees' Compensation (EC) add-on, riding on the same Monthly Salary
    // Credit used for the main SSS contribution above: a flat ₱10/month while MSC is at or below
    // the threshold, ₱30/month once MSC exceeds it. Not deducted from the employee — it's paid
    // entirely by the employer, so it never touches gross/net pay, only the employer-cost total.
    sss: { floorComp:5000, ceilingComp:35000, increment:500, eeRate:0.05, erRate:0.10,
      ec: { threshold:14500, lowAmount:10, highAmount:30 } },
    philhealth: { rate:0.05, eeShare:0.5, floor:10000, ceiling:100000 },
    pagibig: { thresholdComp:1500, eeRateBelow:0.01, eeRateAbove:0.02, erRate:0.02, compCeiling:10000 },
    // 13th month pay (PD 851): amounts up to this ceiling per year are tax-exempt; any excess is
    // taxed. Admin-editable in case the statutory ceiling changes.
    thirteenthMonth: { exemptCeiling: 90000 },
    bir: { table: [
      {min:0,       max:20833,  base:0,        rate:0.00},
      {min:20833,   max:33333,  base:0,        rate:0.15},
      {min:33333,   max:66667,  base:1875,     rate:0.20},
      {min:66667,   max:166667, base:8541.80,  rate:0.25},
      {min:166667,  max:666667, base:33541.80, rate:0.30},
      {min:666667,  max:null,   base:183541.80,rate:0.35}
    ]},
    holidayRates: defaultHolidayRates()
  };
}

// Minimum statutory Philippine holiday-pay multipliers (DOLE Labor Advisory / Presidential
// Proclamation basis). Admin-editable from the Holiday Management page so rates can be updated
// without touching source code if labor regulations change.
function defaultHolidayRates(){
  return {
    regularWorked: 2.00,           // Regular Holiday, worked: 200% of daily basic wage
    regularRestDayWorked: 2.60,    // Regular Holiday + Rest Day, worked: 200% x 130%
    regularOtMultiplier: 1.30,     // Regular Holiday OT: holiday hourly rate x 130%
    specialWorked: 1.30,           // Special Non-Working Day, worked: 130%
    specialRestDayWorked: 1.50,    // Special Non-Working Day + Rest Day, worked: 150%
    specialOtMultiplier: 1.30,     // Special Non-Working Day OT: holiday hourly rate x 130%
    specialWorkingWorked: 1.00     // Special Working Day: normal wage, no premium
  };
}

function seedData(){
  const employees = [
    {id:"EMP001", fullName:"Juan Dela Cruz", position:"Software Developer", department:"Information Technology", employmentStatus:"Regular", basicSalary:35000, status:"Active", email:"juan.delacruz@ledgerco.com", username:"juan.delacruz", password:"Employee123", vlBalance:15, slBalance:15},
    {id:"EMP002", fullName:"Maria Santos", position:"HR Officer", department:"Human Resources", employmentStatus:"Regular", basicSalary:28000, status:"Active", email:"maria.santos@ledgerco.com", username:"maria.santos", password:"Employee123", vlBalance:15, slBalance:15},
    {id:"EMP003", fullName:"Pedro Reyes", position:"Accountant", department:"Finance", employmentStatus:"Regular", basicSalary:32000, status:"Active", email:"pedro.reyes@ledgerco.com", username:"pedro.reyes", password:"Employee123", vlBalance:15, slBalance:15},
    {id:"EMP004", fullName:"Ana Lopez", position:"Marketing Specialist", department:"Marketing", employmentStatus:"Probationary", basicSalary:27000, status:"Active", email:"ana.lopez@ledgerco.com", username:"ana.lopez", password:"Employee123", vlBalance:15, slBalance:15},
    {id:"EMP005", fullName:"Carlo Mendoza", position:"Network Administrator", department:"Information Technology", employmentStatus:"Regular", basicSalary:34000, status:"On Leave", email:"carlo.mendoza@ledgerco.com", username:"carlo.mendoza", password:"Employee123", vlBalance:11, slBalance:15},
    {id:"EMP006", fullName:"Liza Fernandez", position:"Customer Support Rep.", department:"Operations", employmentStatus:"Regular", basicSalary:24000, status:"Active", email:"liza.fernandez@ledgerco.com", username:"liza.fernandez", password:"Employee123", vlBalance:15, slBalance:15}
  ];

  const settings = defaultSettings();
  // Six consecutive 14-day cutoffs spanning July–September 2026 — every employee is paid bi-weekly.
  const biweeklyPeriods = [
    "2026-07-01_2026-07-14","2026-07-15_2026-07-28",
    "2026-08-01_2026-08-14","2026-08-15_2026-08-28",
    "2026-09-01_2026-09-14","2026-09-15_2026-09-28"
  ];
  const payrolls = [];
  let pid = 1;

  function makeInputs(idx, pIdx){
    // Figures are sized for a 14-day cutoff (half of a full month's hours/allowances).
    return {
      regularHoursWorked: Math.round(settings.dailyWorkingHours * 11 / 2),
      otHours: Math.round(([5, 2, 8][pIdx % 3] + (idx % 3)) / 2),
      nsdHours: Math.round([10, 0, 20][pIdx % 3] / 2),
      allowances: Math.round((1500 + (idx*100)%600) / 2),
      holidayPay: pIdx % 3 === 2 ? 600 : 0,
      bonuses: 0,
      incentives: (idx===0 && pIdx===biweeklyPeriods.length-1) ? 1000 : 0,
      otherEarnings: 0,
      salaryLoan: (idx===2 && pIdx % 3 === 0) ? 500 : 0,
      cashAdvance: 0,
      absences: 0,
      tardiness: (idx===4 && pIdx % 3 === 1) ? 75 : 0,
      undertime: 0,
      companyLoan: 0,
      otherDeductions: 0
    };
  }

  employees.forEach((emp, idx) => {
    biweeklyPeriods.forEach((period, pIdx) => {
      const rec = computePayrollRecord(emp, period, makeInputs(idx, pIdx), settings, "biweekly");
      rec.id = "PR" + String(pid++).padStart(4,"0");
      payrolls.push(rec);
    });
  });

  // A sample leave entry consistent with EMP005 (Carlo Mendoza) being seeded "On Leave" —
  // 4 days VL already logged and deducted from his balance above.
  const leaves = [
    { id:"LV0001", employeeId:"EMP005", type:"VL", startDate:"2026-09-22", endDate:"2026-09-25", days:4,
      note:"Approved vacation leave.", createdAt:"2026-09-15", createdBy:"admin" }
  ];

  return {
    admin: {username:"admin", password:"Admin123", fullName:"System Administrator"},
    employees,
    payrolls,
    settings,
    holidays: seedHolidays(),
    leaves
  };
}

/* ============================================================
   PHILIPPINE HOLIDAY SEED DATA (2026)
   Basis: Proclamation No. 1006, s. 2025 (regular holidays & special non-working
   days for 2026), RA 9256 (Ninoy Aquino Day), RA 9849 (Eid'l Fitr / Eid'l Adha).
   Admins can add, edit, deactivate, or delete any of these from Holiday Management —

/* ---------------- HOLIDAY PAY COMPUTATION (DOLE minimum statutory rates) ----------------
   IMPORTANT — how this avoids double-paying the base 100%:
   This system pays every employee a flat per-period "Basic Salary" (monthlySalary/2 for a
   bi-weekly cutoff) regardless of which specific calendar days fall inside the period. For a
   REGULAR holiday, that flat basic salary already carries the day's 100% base wage whether or
   not the holiday is worked (this is why an UNWORKED regular holiday below adds ₱0 — DOLE's
   100% is already inside "Basic Salary"). So when a regular holiday IS worked, only the
   INCREMENTAL statutory premium — the amount on top of that already-paid 100% — must be added
   here, i.e. (multiplier - 1.00), or the employee would effectively be paid the base day twice.
   A SPECIAL (non-working) day is different: DOLE's "no work, no pay" rule means that day's 100%
   is NOT assumed pre-paid, so an unworked special day adds ₱0 for a different reason (no legal
   entitlement), and a WORKED special day correctly adds the FULL statutory multiplier (130%/150%)
   since nothing for that day was paid in advance.
   Rates below are the DOLE-minimum total-day percentages (Labor Advisory on regular holidays /
   special (non-working) days): Regular Holiday worked 200%, +rest day 260% (200%×130%); Special
   Non-Working worked 130%, +rest day 150%; overtime on any of these = that day's hourly rate ×130%.
------------------------------------------------------------------------------------------- */
// entry: {holidayId, hoursWorked, otHours, isRestDay}
function computeHolidayEntry(entry, holiday, hourlyRate, dailyWorkingHours, rates){
  rates = rates || defaultHolidayRates();
  const hoursWorked = Math.max(0, Number(entry.hoursWorked)||0);
  const otHours = Math.max(0, Number(entry.otHours)||0);
  const isRestDay = !!entry.isRestDay;
  const type = holiday.type;

  if(type === "special_working"){
    // Normal basic wage, no special-day premium. Overtime (if any) follows normal OT rules
    // and is already captured by the payroll's regular Overtime Hours field.
    return { holiday, hoursWorked, otHours, isRestDay, rate: 1.00, basicAmt: 0, restPremiumAmt: 0, otAmt: 0, total: 0,
      note: "Special working day — employee's normal daily wage applies; no holiday premium. Log any overtime in the regular Overtime Hours field." };
  }
  if(hoursWorked <= 0){
    if(type === "regular"){
      return { holiday, hoursWorked, otHours, isRestDay, rate: 1.00, basicAmt: 0, restPremiumAmt: 0, otAmt: 0, total: 0,
        note: "Not worked — 100% regular holiday pay is already included in the employee's basic salary for the period." };
    }
    return { holiday, hoursWorked, otHours, isRestDay, rate: 0, basicAmt: 0, restPremiumAmt: 0, otAmt: 0, total: 0,
      note: "Not worked — \"no work, no pay\" applies to special non-working days unless company policy states otherwise." };
  }

  const cappedHours = Math.min(hoursWorked, dailyWorkingHours);
  const baseMultiplier = type === "regular" ? rates.regularWorked : rates.specialWorked;
  const restMultiplier = type === "regular" ? rates.regularRestDayWorked : rates.specialRestDayWorked;
  const otTypeMultiplier = type === "regular" ? rates.regularOtMultiplier : rates.specialOtMultiplier;
  const effMultiplier = isRestDay ? restMultiplier : baseMultiplier;

  // Regular holiday: subtract the 1.00 (100%) already paid via flat Basic Salary so the day
  // isn't compensated twice. Special non-working day: nothing was pre-paid, so the full
  // statutory multiplier applies as-is.
  const payableBaseMultiplier = type === "regular" ? (baseMultiplier - 1) : baseMultiplier;
  const basicAmt = round2(hourlyRate * cappedHours * payableBaseMultiplier);
  const restPremiumAmt = isRestDay ? round2(hourlyRate * cappedHours * (restMultiplier - baseMultiplier)) : 0;
  const otAmt = round2(hourlyRate * otHours * effMultiplier * otTypeMultiplier);
  const total = round2(basicAmt + restPremiumAmt + otAmt);

  return { holiday, hoursWorked, otHours, isRestDay, rate: effMultiplier, basicAmt, restPremiumAmt, otAmt, total, note: null };
}

function computeHolidayEntriesTotal(entries, hourlyRate, dailyWorkingHours, rates){
  const details = (entries||[]).map(e=>{
    const h = findHoliday(e.holidayId);
    return h ? computeHolidayEntry(e, h, hourlyRate, dailyWorkingHours, rates) : null;
  }).filter(Boolean);

  let regularHolidayPay=0, specialHolidayPay=0, holidayRestDayPremium=0, holidayOvertimePay=0;
  details.forEach(d=>{
    if(d.holiday.type==="regular") regularHolidayPay += d.basicAmt;
    else if(d.holiday.type==="special_non_working") specialHolidayPay += d.basicAmt;
    holidayRestDayPremium += d.restPremiumAmt;
    holidayOvertimePay += d.otAmt;
  });
  regularHolidayPay = round2(regularHolidayPay);
  specialHolidayPay = round2(specialHolidayPay);
  holidayRestDayPremium = round2(holidayRestDayPremium);
  holidayOvertimePay = round2(holidayOvertimePay);
  const total = round2(regularHolidayPay + specialHolidayPay + holidayRestDayPremium + holidayOvertimePay);

  return { details, regularHolidayPay, specialHolidayPay, holidayRestDayPremium, holidayOvertimePay, total };
}

/* ============================================================
   PHILIPPINE PAYROLL CALCULATION ENGINE
============================================================ */
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }

function computeSSS(basicMonthly, settings){
  const s = settings.sss;
  const comp = Math.max(s.floorComp, Math.min(basicMonthly, s.ceilingComp));
  // SSS assigns the Monthly Salary Credit by which ₱500 bracket the compensation falls
  // nearest to (e.g. ₱19,750–₱20,249.99 → MSC ₱20,000), not by rounding up to the next
  // bracket — so this must be a nearest-bracket round, not a ceiling.
  let msc = Math.round(comp / s.increment) * s.increment;
  msc = Math.max(s.floorComp, Math.min(msc, s.ceilingComp));
  const ee = round2(msc * s.eeRate);
  const er = round2(msc * s.erRate);
  return {msc, eeRate:s.eeRate, erRate:s.erRate, ee, er, total: round2(ee+er)};
}

// SSS Employees' Compensation (EC) contribution — a small employer-only add-on riding on the
// same Monthly Salary Credit as the main SSS contribution. Never deducted from the employee.
function computeEC(msc, settings){
  const e = (settings.sss && settings.sss.ec) || {threshold:14500, lowAmount:10, highAmount:30};
  return round2(msc > e.threshold ? e.highAmount : e.lowAmount);
}

function computePhilHealth(basicMonthly, settings){
  const p = settings.philhealth;
  const base = Math.max(p.floor, Math.min(basicMonthly, p.ceiling));
  const total = round2(base * p.rate);
  const ee = round2(total * p.eeShare);
  const er = round2(total - ee);
  return {base, rate:p.rate, eeShare:p.eeShare, ee, er, total};
}

function computePagIbig(basicMonthly, settings){
  const g = settings.pagibig;
  const base = Math.min(basicMonthly, g.compCeiling);
  const eeRate = basicMonthly <= g.thresholdComp ? g.eeRateBelow : g.eeRateAbove;
  const ee = round2(base * eeRate);
  const er = round2(base * g.erRate);
  return {base, eeRate, erRate:g.erRate, ee, er, total: round2(ee+er)};
}

function computeWithholdingTax(taxableMonthly, settings){
  const table = settings.bir.table;
  const t = Math.max(0, taxableMonthly);
  const row = table.find(r => t > r.min && (r.max===null || t <= r.max)) || table[0];
  const tax = row.base + (t - row.min) * row.rate;
  return {taxable: t, bracket: row, amount: Math.max(0, round2(tax))};
}

function scaleContribution(c, factor){
  return { ...c, ee: round2(c.ee*factor), er: round2(c.er*factor), total: round2(c.total*factor) };
}

function computePayrollRecord(emp, period, inputs, settings, payFrequency){
  inputs = inputs || {};
  const frequency = payFrequency || inferFrequencyFromPeriod(period);
  const isBiweekly = frequency === "biweekly";

  const monthlySalary = Number(emp.basicSalary)||0;
  const dailyRate = round2((monthlySalary * 12) / settings.workingDaysPerYear);
  const hourlyRate = round2(dailyRate / settings.dailyWorkingHours);

  const regularHoursWorked = Number(inputs.regularHoursWorked)||0;
  const otHours = Number(inputs.otHours)||0;
  const nsdHours = Number(inputs.nsdHours)||0;
  const otMultiplier = settings.otMultiplier;
  const nsdRate = settings.nsdRate;
  const otPay = round2(hourlyRate * otHours * otMultiplier);
  const nsdPay = round2(hourlyRate * nsdHours * nsdRate);

  const allowances = Number(inputs.allowances)||0;
  // Philippine holiday pay: computed automatically from any holiday work entries the admin added
  // (see computeHolidayEntriesTotal). Falls back to a plain manual figure for older records / inputs
  // that don't carry structured entries, so nothing already saved is lost.
  const holidayEntries = Array.isArray(inputs.holidayEntries) ? inputs.holidayEntries.filter(e=>e && e.holidayId) : [];
  let holidayPay, regularHolidayPay = 0, specialHolidayPay = 0, holidayRestDayPremium = 0, holidayOvertimePay = 0, holidayBreakdown = [];
  if(holidayEntries.length){
    const hc = computeHolidayEntriesTotal(holidayEntries, hourlyRate, settings.dailyWorkingHours, settings.holidayRates || defaultHolidayRates());
    holidayPay = hc.total;
    regularHolidayPay = hc.regularHolidayPay; specialHolidayPay = hc.specialHolidayPay;
    holidayRestDayPremium = hc.holidayRestDayPremium; holidayOvertimePay = hc.holidayOvertimePay;
    holidayBreakdown = hc.details;
  } else {
    holidayPay = Number(inputs.holidayPay)||0;
  }
  const bonuses = Number(inputs.bonuses)||0;
  const incentives = Number(inputs.incentives)||0;
  const otherEarnings = Number(inputs.otherEarnings)||0;

  // Basic pay for the period: half the monthly salary for a bi-weekly cutoff, full monthly salary otherwise.
  const basicPay = isBiweekly ? round2(monthlySalary / 2) : monthlySalary;
  const grossPay = round2(basicPay + otPay + nsdPay + holidayPay + allowances + bonuses + incentives + otherEarnings);

  // Statutory contribution tables (SSS/PhilHealth/Pag-IBIG) are defined on MONTHLY compensation,
  // so always compute the full monthly contribution first, then split it in half for a bi-weekly cutoff.
  const splitFactor = isBiweekly ? 0.5 : 1;
  const sssMonthly = computeSSS(monthlySalary, settings);
  const philhealthMonthly = computePhilHealth(monthlySalary, settings);
  const pagibigMonthly = computePagIbig(monthlySalary, settings);
  const sss = scaleContribution(sssMonthly, splitFactor);
  const philhealth = scaleContribution(philhealthMonthly, splitFactor);
  const pagibig = scaleContribution(pagibigMonthly, splitFactor);
  // SSS EC: employer-only, informational — never subtracted from the employee's pay.
  const ec = round2(computeEC(sssMonthly.msc, settings) * splitFactor);

  // Withholding tax: bring this period's gross up to a monthly-equivalent figure, tax it against the
  // monthly BIR table, then bring the resulting tax back down to a per-period amount.
  const monthlyEquivGross = isBiweekly ? round2(grossPay * 2) : grossPay;
  const taxableIncome = Math.max(0, monthlyEquivGross - sssMonthly.ee - philhealthMonthly.ee - pagibigMonthly.ee);
  const withholdingMonthly = computeWithholdingTax(taxableIncome, settings);
  const withholdingTax = { ...withholdingMonthly, amount: isBiweekly ? round2(withholdingMonthly.amount/2) : withholdingMonthly.amount };

  const salaryLoan = Number(inputs.salaryLoan)||0;
  const cashAdvance = Number(inputs.cashAdvance)||0;
  const absences = Number(inputs.absences)||0;
  const tardiness = Number(inputs.tardiness)||0;
  const undertime = Number(inputs.undertime)||0;
  const companyLoan = Number(inputs.companyLoan)||0;
  const otherDeductions = Number(inputs.otherDeductions)||0;
  // Unpaid leave: days come from Leave Management entries logged as type "Unpaid" that fall
  // inside this payroll period (see unpaidLeaveDaysInPeriod). Paid VL/SL leave draws down the
  // employee's leave balance instead and does not reduce pay.
  const unpaidLeaveDays = Number(inputs.unpaidLeaveDays)||0;
  const unpaidLeaveDeduction = round2(dailyRate * unpaidLeaveDays);
  const otherDeductTotal = round2(salaryLoan+cashAdvance+absences+tardiness+undertime+companyLoan+otherDeductions+unpaidLeaveDeduction);

  const totalDeductions = round2(sss.ee + philhealth.ee + pagibig.ee + withholdingTax.amount + otherDeductTotal);
  const netPay = round2(grossPay - totalDeductions);

  return {
    employeeId: emp.id, period, payFrequency: frequency,
    dailyRate, hourlyRate,
    regularHoursWorked, otHours, otMultiplier, otPay,
    nsdHours, nsdRate, nsdPay,
    basicSalary: basicPay, allowances, holidayPay, bonuses, incentives, otherEarnings,
    holidayEntries, holidayBreakdown, regularHolidayPay, specialHolidayPay, holidayRestDayPremium, holidayOvertimePay,
    gross: grossPay,
    sss, philhealth, pagibig, withholdingTax, ec,
    salaryLoan, cashAdvance, absences, tardiness, undertime, companyLoan, otherDeductions,
    unpaidLeaveDays, unpaidLeaveDeduction, otherDeductTotal,
    overtime: otPay, // legacy alias used by list views
    deductions: totalDeductions, // legacy alias used by list views
    totalDeductions,
    net: netPay
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.settings) parsed.settings = defaultSettings();
      if(!parsed.settings.holidayRates) parsed.settings.holidayRates = defaultHolidayRates();
      if(!parsed.settings.sss.ec) parsed.settings.sss.ec = defaultSettings().sss.ec;
      if(!parsed.settings.thirteenthMonth) parsed.settings.thirteenthMonth = defaultSettings().thirteenthMonth;
      if(!Array.isArray(parsed.holidays)) parsed.holidays = seedHolidays();
      if(!Array.isArray(parsed.leaves)) parsed.leaves = [];
      (parsed.employees||[]).forEach(e=>{
        if(typeof e.vlBalance !== "number") e.vlBalance = 15;
        if(typeof e.slBalance !== "number") e.slBalance = 15;
      });
      return parsed;
    }
  }catch(e){}
  const fresh = seedData();
  saveDB(fresh);
  return fresh;
}

}

function initials(name){
  return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
}
/* ---------------- PAY PERIOD HELPERS (monthly + bi-weekly) ---------------- */
// Monthly periods are stored as "YYYY-MM" (e.g. "2026-09").
// Bi-weekly periods are stored as "YYYY-MM-DD_YYYY-MM-DD" — a 14-day cutoff (e.g. "2026-09-01_2026-09-14").
function isBiweeklyPeriod(p){ return typeof p === "string" && p.indexOf("_") !== -1; }
// 13th month pay records use a synthetic yearly "period" of the form "YYYY-13TH" so they sort
// and filter alongside regular payroll periods without needing a parallel data structure.
function isThirteenthMonthPeriod(p){ return typeof p === "string" && /^\d{4}-13TH$/.test(p); }
function inferFrequencyFromPeriod(p){ return isBiweeklyPeriod(p) ? "biweekly" : "monthly"; }
function parseISODate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function biweeklyPeriodFromStart(startStr){
  const start = parseISODate(startStr);
  const end = new Date(start);
  end.setDate(end.getDate() + 13); // 14-day cutoff, inclusive of the start date
  return `${startStr}_${isoDate(end)}`;
}
// Inclusive date range covered by a period string, used for chronological sorting and overlap checks.
function periodRange(p){
  if(isThirteenthMonthPeriod(p)){
    const y = Number(p.slice(0,4));
    return { start: new Date(y,0,1), end: new Date(y,11,31) };
  }
  if(isBiweeklyPeriod(p)){
    const [s,e] = p.split("_");
    return { start: parseISODate(s), end: parseISODate(e) };
  }
  const [y,m] = p.split("-").map(Number);
  return { start: new Date(y, (m||1)-1, 1), end: new Date(y, m||1, 0) }; // last day of month
}
function periodStart(p){ return periodRange(p).start; }
function periodsOverlap(pA, pB){
  const a = periodRange(pA), b = periodRange(pB);
  return a.start <= b.end && b.start <= a.end;
}
// Finds another payroll record for the same employee whose period date range overlaps this one
// (covers monthly-vs-monthly, bi-weekly-vs-bi-weekly, and mixed monthly/bi-weekly overlaps).
function findOverlappingPayroll(employeeId, period, excludeId){
  // 13th month records span the whole calendar year but are a separate annual payout, not a
  // regular cutoff, so they're excluded from the regular-period overlap check.
  return db.payrolls.find(p => p.employeeId===employeeId && p.id!==excludeId && p.recordType!=="13th_month" && periodsOverlap(p.period, period));
}
function periodLabel(p){
  if(isThirteenthMonthPeriod(p)) return `13th Month Pay ${p.slice(0,4)}`;
  if(isBiweeklyPeriod(p)){
    const [s,e] = p.split("_");
    const start = parseISODate(s), end = parseISODate(e);
    const fmtShort = d => d.toLocaleString("en-US",{month:"short", day:"numeric"});
    const fmtFull = d => d.toLocaleString("en-US",{month:"short", day:"numeric", year:"numeric"});
    return `${fmtShort(start)} – ${fmtFull(end)} (Bi-Weekly)`;
  }
  const [y,m] = p.split("-");
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleString("en-US",{month:"long", year:"numeric"});
}
function findEmployee(id){ return db.employees.find(e=>e.id===id); }

/* ---------------- LEAVE (VL/SL) TRACKING ---------------- */
function findLeave(id){ return (db.leaves||[]).find(l=>l.id===id); }
function leaveTypeLabel(t){ return t==="VL" ? "Vacation Leave" : t==="SL" ? "Sick Leave" : "Unpaid Leave"; }
function daysBetweenInclusive(startStr, endStr){
  const s = parseISODate(startStr), e = parseISODate(endStr);
  return Math.round((e - s) / 86400000) + 1;
}
// How many of a leave entry's days fall inside a given payroll period — used to auto-detect
// unpaid leave when generating payroll, and to support leave spanning multiple pay periods.
function leaveDaysOverlappingPeriod(leave, period){
  const pr = periodRange(period);
  const s = parseISODate(leave.startDate), e = parseISODate(leave.endDate);
  const start = s > pr.start ? s : pr.start;
  const end = e < pr.end ? e : pr.end;
  if(start > end) return 0;
  return Math.round((end - start) / 86400000) + 1;
}
function unpaidLeaveDaysInPeriod(employeeId, period){
  if(!period) return 0;

/* ---------------- 13TH MONTH PAY (PD 851) ---------------- */
// Total basic salary actually paid out across the calendar year, divided by 12 — the statutory
// formula. Using each period's already-prorated Basic Pay figure (not the monthly rate) means an
// employee who joined mid-year, or was on unpaid leave, is automatically prorated correctly,
// since periods with no payroll record simply contribute nothing.
function computeThirteenthMonthBasis(employeeId, year){
  return round2(db.payrolls
    .filter(p => p.employeeId===employeeId && p.recordType!=="13th_month" && periodRange(p.period).start.getFullYear()===year)
    .reduce((sum,p)=> sum + (Number(p.basicSalary)||0), 0));
}
function releasedThirteenthMonth(employeeId, year){
  return db.payrolls.find(p => p.employeeId===employeeId && p.recordType==="13th_month" && p.period===`${year}-13TH`);
}
function availableYearsForThirteenth(){
  const years = new Set([new Date().getFullYear()]);
  db.payrolls.forEach(p=>{ if(p.recordType!=="13th_month") years.add(periodRange(p.period).start.getFullYear()); });
  return [...years].sort((a,b)=>b-a);
}
// Simplification, noted on the page itself: the taxable excess over the exemption ceiling is run
// through the same monthly BIR table as a stand-in for the annualized computation BIR actually
// requires. Good enough for an estimate; a real payroll run should true this up at year-end.
function computeThirteenthMonthPay(employeeId, year, settings){
  const basis = computeThirteenthMonthBasis(employeeId, year);
  const gross = round2(basis / 12);
  const ceiling = (settings.thirteenthMonth && settings.thirteenthMonth.exemptCeiling) || 90000;
  const taxableExcess = round2(Math.max(0, gross - ceiling));
  const tax = taxableExcess > 0 ? computeWithholdingTax(taxableExcess, settings).amount : 0;
  const net = round2(gross - tax);
  return { basis, gross, ceiling, taxableExcess, tax, net };
}

function handleLogin(e){
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;

  if(username === db.admin.username && password === db.admin.password){
    state.currentUser = {role:"admin", username, fullName: db.admin.fullName};
    state.view = "adminDashboard";
    state.loginError = "";
    render();
    return;
  }
  const emp = db.employees.find(e => e.username === username && e.password === password);
  if(emp){
    state.currentUser = {role:"employee", username, employeeId: emp.id, fullName: emp.fullName};
    state.view = "employeeDashboard";
    state.loginError = "";
    render();
    return;
  }
  state.loginError = "Incorrect username or password.";
  render();
}

/* ---------------- ADMIN DASHBOARD ---------------- */
function latestRecordsPerEmployee(list, n){
  // Returns, for every employee that has payroll records, their n most recent runs
  // (by period end date) — used instead of a single shared "period" so the dashboard
  // still makes sense when employees are on different pay frequencies.
  const byEmp = {};
  list.forEach(p=>{
    if(!byEmp[p.employeeId]) byEmp[p.employeeId] = [];
    byEmp[p.employeeId].push(p);
  });
  Object.values(byEmp).forEach(arr=> arr.sort((a,b)=> periodRange(b.period).end - periodRange(a.period).end));
  return byEmp;
}

function renderAdminDashboard(){
  const totalEmployees = db.employees.length;
  const activeEmployees = db.employees.filter(e=>e.status==="Active").length;

  // 13th month releases are an annual bonus payout, not a regular cutoff, so they're excluded
  // from the "most recent run" comparison — otherwise releasing one would make the dashboard's
  // net-pay figure jump to the 13th month amount instead of reflecting the latest regular payroll.
  const regularPayrolls = db.payrolls.filter(p=>p.recordType!=="13th_month");
  const byEmp = latestRecordsPerEmployee(regularPayrolls);
  const latestRecords = Object.values(byEmp).map(arr=>arr[0]).filter(Boolean);
  const prevRecords = Object.values(byEmp).map(arr=>arr[1]).filter(Boolean);
  const mostRecentEnd = latestRecords.reduce((max,p)=>{
    const end = periodRange(p.period).end;
    return (!max || end>max) ? end : max;
  }, null);

  const totalPayroll = latestRecords.reduce((s,p)=>s+p.net,0);
  const totalDeductions = latestRecords.reduce((s,p)=>s+p.deductions,0);
  const prevTotalPayroll = prevRecords.reduce((s,p)=>s+p.net,0);
  const prevTotalDeductions = prevRecords.reduce((s,p)=>s+p.deductions,0);
  const recent = [...db.payrolls].sort((a,b)=> periodStart(b.period)-periodStart(a.period)).slice(0,6);

  const deltaHtml = (curr, prev, invert) => {
    if(prevRecords.length===0) return `<div class="ledger-sub">No prior run to compare</div>`;
    const diff = curr - prev;
    const pct = prev ? (diff/prev*100) : 0;
    const good = invert ? diff <= 0 : diff >= 0;
    const arrow = diff === 0 ? "—" : (diff > 0 ? "▲" : "▼");
    return `<div class="ledger-delta ${good?'up':'down'}">${arrow} ${Math.abs(pct).toFixed(1)}% vs previous run</div>`;
  };

  return `
  <div class="page-head">
    <div><h2>Dashboard</h2><p>Each employee's most recent payroll run${mostRecentEnd ? " — through " + mostRecentEnd.toLocaleString("en-US",{month:"long",day:"numeric",year:"numeric"}) : ""}</p></div>
  </div>
  <div class="stat-grid">
    <div class="ledger-strip">
      <div class="ledger-stat clickable" data-nav="employees">
        <div class="ledger-label">Total Employees</div>
        <div class="ledger-figure">${totalEmployees}</div>
        <div class="ledger-sub">${activeEmployees} active</div>
      </div>
      <div class="ledger-stat clickable" data-nav="payrollHistory">
        <div class="ledger-label">Total Payroll, net</div>
        <div class="ledger-figure">${money(totalPayroll)}</div>
        ${deltaHtml(totalPayroll, prevTotalPayroll, false)}
      </div>
      <div class="ledger-stat clickable" data-nav="payrollHistory">
        <div class="ledger-label">Total Deductions</div>
        <div class="ledger-figure">${money(totalDeductions)}</div>
        ${deltaHtml(totalDeductions, prevTotalDeductions, true)}
      </div>
    </div>
  </div>
  <div class="panel">
    <h3>Recent Payroll Records</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Employee</th><th>Period</th><th>Gross</th><th>Deductions</th><th>Net</th></tr></thead>
        <tbody>
          ${recent.map(r=>{
            const emp = findEmployee(r.employeeId) || {fullName:"Unknown"};
            return `<tr data-view-pr="${r.id}">
              <td>${emp.fullName}</td>
              <td>${periodLabel(r.period)}</td>
              <td class="tabular">${money(r.gross)}</td>
              <td class="tabular">${money(r.deductions)}</td>
              <td class="tabular"><strong style="color:var(--c-green);">${money(r.net)}</strong></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function saveEmployeeForm(existing){
  const id = document.getElementById("f-id").value.trim();
  const fullName = document.getElementById("f-name").value.trim();
  const position = document.getElementById("f-position").value.trim();
  const department = document.getElementById("f-department").value.trim();
  const basicSalary = Number(document.getElementById("f-basic").value);
  const employmentStatus = document.getElementById("f-empstatus").value;
  const status = document.getElementById("f-status").value;
  const email = document.getElementById("f-email").value.trim();
  const username = document.getElementById("f-username").value.trim();
  const password = document.getElementById("f-password").value;

  if(!id || !fullName || !position || !department || !email || !username || !password){
    toast("Please fill in all required fields.", "error");
    return;
  }
  if(!existing && db.employees.some(e=>e.id===id)){
    toast("An employee with that ID already exists.", "error");
    return;
  }
  if(db.employees.some(e => e.username === username && (!existing || e.id !== existing.id))){
    toast("That username is already taken.", "error");
    return;
  }

  const record = {id, fullName, position, department, employmentStatus, basicSalary, status, email, username, password,
    vlBalance: existing ? existing.vlBalance : 15, slBalance: existing ? existing.slBalance : 15};

  if(existing){
    const idx = db.employees.findIndex(e=>e.id===existing.id);
    db.employees[idx] = record;
    toast("Employee updated.");
  }else{
    db.employees.push(record);
    toast("Employee added.");
  }
  saveDB(db);
  closeModal();
  render();
}

function confirmDeleteEmployee(id){

      saveDB(db);
      toast("Employee deleted.");
      closeModal();
      render();
    }
  });
}

function saveHolidayForm(existing){
  const name = document.getElementById("hf-name").value.trim();
  const date = document.getElementById("hf-date").value;
  const type = document.getElementById("hf-type").value;
  const status = document.getElementById("hf-status").value;
  const recurring = document.getElementById("hf-recurring").value === "yes";
  const source = document.getElementById("hf-source").value.trim();
  const description = document.getElementById("hf-description").value.trim();

  if(!name || !date){
    toast("Please enter a holiday name and date.", "error");
    return;
  }
  const who = (state.currentUser && state.currentUser.username) || "admin";
  if(!db.holidays) db.holidays = [];

  if(existing){
    const idx = db.holidays.findIndex(x=>x.id===existing.id);
    db.holidays[idx] = { ...existing, name, date, year: Number(date.slice(0,4)), type, status, recurring, source, description, updatedBy: who };
    toast("Holiday updated.");
  }else{
    const newId = "HOL" + String(db.holidays.length+1).padStart(3,"0") + Math.floor(Math.random()*90+10);
    db.holidays.push({ id:newId, name, date, year:Number(date.slice(0,4)), type, status, recurring, source, description, createdBy: who, updatedBy: who });
    toast("Holiday added.");
  }
  saveDB(db);
  closeModal();
  render();
}

// Attaches interactivity to a rendered holiday-entries container and keeps it in sync with `entries`.
// getEmp()/getPeriod() are called fresh each time so the block stays correct as the surrounding form changes.
function wireHolidayEntriesBlock(prefix, entries, getEmp, getPeriod, containerId, onRecompute){
  const container = document.getElementById(containerId);
  if(!container) return null;

  function hourlyRateFor(emp){
    if(!emp) return 0;
    const dailyRate = round2((Number(emp.basicSalary)||0) * 12 / db.settings.workingDaysPerYear);
    return round2(dailyRate / db.settings.dailyWorkingHours);
  }

  function refresh(){
    const period = getPeriod();
    const hourlyRate = hourlyRateFor(getEmp());
    container.innerHTML = holidayEntriesBlockHtml(prefix, entries, period, hourlyRate);
    wireRows();
    if(onRecompute) onRecompute();
  }

  function wireRows(){
    const addBtn = container.querySelector(`.${prefix}-hol-add`);
    if(addBtn) addBtn.addEventListener("click", ()=>{
      const avail = holidaysInPeriod(getPeriod());
      entries.push({ holidayId: avail[0] ? avail[0].id : "", hoursWorked: 8, otHours: 0, isRestDay: false });
      refresh();
    });
    container.querySelectorAll(`.${prefix}-hol-remove`).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        entries.splice(Number(btn.getAttribute("data-hol-idx")), 1);
        refresh();
      });
    });
    container.querySelectorAll(`.${prefix}-hol-select`).forEach(sel=>{
      sel.addEventListener("change", ()=>{
        entries[Number(sel.getAttribute("data-hol-idx"))].holidayId = sel.value;
        refresh();
      });
    });
    container.querySelectorAll(`.${prefix}-hol-rest`).forEach(cb=>{
      cb.addEventListener("change", ()=>{
        entries[Number(cb.getAttribute("data-hol-idx"))].isRestDay = cb.checked;
        refresh();
      });
    });
    container.querySelectorAll(`.${prefix}-hol-hours, .${prefix}-hol-ot`).forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const idx = Number(inp.getAttribute("data-hol-idx"));
        const field = inp.classList.contains(`${prefix}-hol-hours`) ? "hoursWorked" : "otHours";
        entries[idx][field] = Number(inp.value)||0;
        // Update just this row's calculation, so the input keeps focus while typing.
        const h = findHoliday(entries[idx].holidayId);
        const calcBox = document.getElementById(`${prefix}-hol-calc-${idx}`);
        if(h && calcBox){
          const calc = computeHolidayEntry(entries[idx], h, hourlyRateFor(getEmp()), db.settings.dailyWorkingHours, db.settings.holidayRates || defaultHolidayRates());
          calcBox.innerHTML = holidayEntryCalcHtml(calc);
        }
        if(onRecompute) onRecompute();
      });
    });
  }

  refresh();
  return { refresh };
}

function openLeaveModal(){
  openModal({
    title: "Log Leave",
    bodyHtml: leaveFormHtml(),
    confirmLabel: "Log Leave",
    onConfirm: saveLeaveForm
  });
  const empSel = document.getElementById("lf-employee");
  const typeSel = document.getElementById("lf-type");
  const startInp = document.getElementById("lf-start");
  const endInp = document.getElementById("lf-end");
  function updateSummary(){
    const emp = findEmployee(empSel.value);
    const days = Math.max(0, daysBetweenInclusive(startInp.value, endInp.value));
    const box = document.getElementById("lf-summary");
    if(!emp || !startInp.value || !endInp.value || days<=0){ box.textContent = ""; return; }
    if(typeSel.value==="Unpaid"){
      box.textContent = `${days} day(s) — unpaid, does not affect VL/SL balance. Will be auto-detected as a payroll deduction for any period it overlaps.`;
    } else {
      const bal = typeSel.value==="VL" ? emp.vlBalance : emp.slBalance;
      box.textContent = `${days} day(s) — ${bal >= days ? `${bal-days} day(s) will remain` : `insufficient balance (only ${bal} day(s) available)`}.`;
      box.style.color = bal>=days ? "var(--ink-soft)" : "var(--danger)";
    }
  }
  [empSel, typeSel, startInp, endInp].forEach(el=> el.addEventListener("input", updateSummary));
  [empSel, typeSel].forEach(el=> el.addEventListener("change", updateSummary));
  updateSummary();
}

function saveLeaveForm(){
  const employeeId = document.getElementById("lf-employee").value;
  const type = document.getElementById("lf-type").value;
  const startDate = document.getElementById("lf-start").value;
  const endDate = document.getElementById("lf-end").value;
  const note = document.getElementById("lf-note").value.trim();
  const emp = findEmployee(employeeId);

  if(!emp || !startDate || !endDate){ toast("Please complete all required fields.", "error"); return; }
  const days = daysBetweenInclusive(startDate, endDate);
  if(days <= 0){ toast("End date must be on or after the start date.", "error"); return; }

  if(type !== "Unpaid"){
    const balField = type==="VL" ? "vlBalance" : "slBalance";
    if(emp[balField] < days){
      toast(`Insufficient ${type} balance — only ${emp[balField]} day(s) available.`, "error");
      return;
    }
    emp[balField] = round2(emp[balField] - days);
  }

  if(!db.leaves) db.leaves = [];
  const who = (state.currentUser && state.currentUser.username) || "admin";
  const newId = "LV" + String(db.leaves.length+1).padStart(4,"0") + Math.floor(Math.random()*90+10);
  db.leaves.push({ id:newId, employeeId, type, startDate, endDate, days, note, createdAt: isoDate(new Date()), createdBy: who });
  saveDB(db);
  toast("Leave logged.");
  closeModal();
  render();
}

        <tbody>
        ${history.length===0 ? `<tr><td colspan="4"><div class="empty-state">No leave logged yet.</div></td></tr>` :
        history.map(l=>{
          const badgeClass = l.type==="VL" ? "holiday-badge-regular" : l.type==="SL" ? "holiday-badge-special_working" : "holiday-badge-special_non_working";
          return `<tr>

      </table>
    </div>
  </div>`;
}

function renderThirteenthMonth(){
  const years = availableYearsForThirteenth();
  const year = state.thirteenthYear || years[0];
  const s = db.settings;

  const rows = db.employees.map(emp=>{
    const calc = computeThirteenthMonthPay(emp.id, year, s);
    const released = releasedThirteenthMonth(emp.id, year);
    return { emp, calc, released };
  });

  return `
  <div class="page-head">
    <div><h2>13th Month Pay</h2><p>Computed per PD 851 — total Basic Pay earned across the year, divided by 12. Amounts up to the exempt ceiling (set in Payroll Settings) are tax-free; any excess is estimated using the BIR table.</p></div>
    <select id="th13-year">${years.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}</select>
  </div>
  <div class="panel" style="padding:0;">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Employee</th><th>Basic Pay Earned (${year})</th><th>13th Month (Gross)</th><th>Taxable Excess</th><th>Withholding Tax</th><th>Net 13th Month Pay</th><th></th>
        </tr></thead>
        <tbody>
        ${rows.map(({emp,calc,released})=>`
          <tr>
            <td>${emp.fullName}</td>
            <td class="tabular">${money(calc.basis)}</td>
            <td class="tabular">${money(calc.gross)}</td>
            <td class="tabular">${money(calc.taxableExcess)}</td>
            <td class="tabular">− ${money(calc.tax)}</td>
            <td class="tabular"><strong>${money(calc.net)}</strong></td>
            <td>
              <div class="row-actions">
                ${released ? `
                  <span class="status-pill status-active" style="margin-right:4px;">Released</span>
                  <button class="btn btn-ghost btn-sm btn-ghost-blue" data-view-pr="${released.id}">View</button>
                  <button class="btn btn-ghost btn-sm btn-ghost-green" data-print-pr="${released.id}">Print</button>
                ` : `
                  <button class="btn btn-ghost btn-sm btn-ghost-plum" data-release-13th="${emp.id}" ${calc.gross<=0?"disabled":""}>Release</button>
                `}
              </div>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function releaseThirteenthMonth(employeeId){
  const year = state.thirteenthYear;
  const emp = findEmployee(employeeId);
  if(!emp) return;
  if(releasedThirteenthMonth(employeeId, year)){ toast("Already released for this year.", "error"); return; }
  const calc = computeThirteenthMonthPay(employeeId, year, db.settings);
  if(calc.gross <= 0){ toast("No basic pay recorded for this employee in this year.", "error"); return; }

  const zeroContribution = {msc:0, eeRate:0, erRate:0, ee:0, er:0, total:0};
  const rec = {
    id: "PR13" + year + employeeId + Math.floor(Math.random()*90+10),
    employeeId, period: `${year}-13TH`, payFrequency: "13th_month", recordType: "13th_month",
    dailyRate:0, hourlyRate:0,
    regularHoursWorked:0, otHours:0, otMultiplier:0, otPay:0,
    nsdHours:0, nsdRate:0, nsdPay:0,
    basicSalary: calc.gross, allowances:0, holidayPay:0, bonuses:0, incentives:0, otherEarnings:0,
    holidayEntries:[], holidayBreakdown:[], regularHolidayPay:0, specialHolidayPay:0, holidayRestDayPremium:0, holidayOvertimePay:0,
    gross: calc.gross,
    sss: {...zeroContribution}, philhealth: {base:0,rate:0,eeShare:0,ee:0,er:0,total:0}, pagibig: {base:0,eeRate:0,erRate:0,ee:0,er:0,total:0},
    withholdingTax: { taxable: calc.taxableExcess, bracket: null, amount: calc.tax },
    ec: 0,
    salaryLoan:0, cashAdvance:0, absences:0, tardiness:0, undertime:0, companyLoan:0, otherDeductions:0,
    unpaidLeaveDays:0, unpaidLeaveDeduction:0, otherDeductTotal:0,
    overtime:0,
    deductions: calc.tax,
    totalDeductions: calc.tax,
    net: calc.net,
    thirteenthMonthYear: year,
    thirteenthMonthBasis: calc.basis
  };
  db.payrolls.push(rec);
  saveDB(db);
  toast(`13th month pay released for ${emp.fullName}.`);
  render();
}

function wireThirteenthMonth(){
  const yearSel = document.getElementById("th13-year");
  if(!yearSel) return;
  yearSel.addEventListener("change", (e)=>{ state.thirteenthYear = Number(e.target.value); render(); });
  document.querySelectorAll("[data-release-13th]").forEach(el=>{
    el.addEventListener("click", ()=> releaseThirteenthMonth(el.getAttribute("data-release-13th")));
  });
  // data-print-pr / data-view-pr on this page's "Released" rows are already wired
  // generically in wireShellEvents (shared with the Payroll History page) — binding
  // them again here would double-fire the click (e.g. two print dialogs).
}

function readPayrollForm(){
  const g = id => Number(document.getElementById(id).value)||0;
  const empSelect = document.getElementById("pr-employee");
  return {
    regularHoursWorked: g("pr-reghours"), otHours: g("pr-othours"), nsdHours: g("pr-nsdhours"),
    allowances: g("pr-allow"), holidayEntries: state.prHolidayEntries, bonuses: g("pr-bonus"),
    incentives: g("pr-incentive"), otherEarnings: g("pr-other"),
    salaryLoan: g("pr-loan"), cashAdvance: g("pr-advance"), absences: g("pr-absences"),
    tardiness: g("pr-tardiness"), undertime: g("pr-undertime"), companyLoan: g("pr-comploan"),
    otherDeductions: g("pr-otherded"),
    unpaidLeaveDays: empSelect ? unpaidLeaveDaysInPeriod(empSelect.value, getPayrollFormPeriod()) : 0
  };
}

function getPayrollFormFrequency(){
  const el = document.getElementById("pr-frequency");
  return el ? el.value : "monthly";
}
function getPayrollFormPeriod(){
  if(getPayrollFormFrequency()==="biweekly"){
    const startVal = document.getElementById("pr-period-start").value;
    return startVal ? biweeklyPeriodFromStart(startVal) : "";
  }
  return document.getElementById("pr-period-month").value;
}

function wirePayrollCreate(){
  const empSelect = document.getElementById("pr-employee");
  if(!empSelect) return;
  const freqSelect = document.getElementById("pr-frequency");
  const monthlyWrap = document.getElementById("pr-period-monthly-wrap");
  const biweeklyWrap = document.getElementById("pr-period-biweekly-wrap");
  const reghoursInput = document.getElementById("pr-reghours");

  function toggleFrequencyUI(){
    const isBiweekly = freqSelect.value === "biweekly";
    monthlyWrap.style.display = isBiweekly ? "none" : "";
    biweeklyWrap.style.display = isBiweekly ? "" : "none";
    document.getElementById("pr-basicpay-label").textContent = isBiweekly ? "Basic Pay (this cutoff)" : "Basic Pay (this period)";
    // Nudge the default regular-hours figure to match the cutoff length, without overriding a user edit.
    if(reghoursInput && !reghoursInput.dataset.touched){
      reghoursInput.value = isBiweekly ? "88" : "176";
    }
    updateRangeDisplay();
  }
  function updateRangeDisplay(){
    if(freqSelect.value !== "biweekly") return;
    const startVal = document.getElementById("pr-period-start").value;
    const disp = document.getElementById("pr-period-range-display");
    if(startVal){
      const period = biweeklyPeriodFromStart(startVal);
      disp.textContent = "Covers: " + periodLabel(period);
    } else {
      disp.textContent = "";
    }
  }

  function updatePreview(){
    const emp = findEmployee(empSelect.value);
    if(!emp) return;
    const period = getPayrollFormPeriod() || "2026-09";
    const frequency = getPayrollFormFrequency();
    const rec = computePayrollRecord(emp, period, readPayrollForm(), db.settings, frequency);
    document.getElementById("pr-monthly").value = money(emp.basicSalary);
    document.getElementById("pr-basicpay").value = money(rec.basicSalary);
    document.getElementById("pr-daily").value = money(rec.dailyRate);
    document.getElementById("pr-hourly").value = money(rec.hourlyRate);
    document.getElementById("pr-holiday").value = money(rec.holidayPay);
    document.getElementById("pr-leave").value = rec.unpaidLeaveDays ? `${rec.unpaidLeaveDays} day(s) — ${money(rec.unpaidLeaveDeduction)}` : "None this period";
    document.getElementById("pr-preview").innerHTML = payrollPreviewHtml(rec);
  }

  const holidayCtrl = wireHolidayEntriesBlock("pr", state.prHolidayEntries,
    () => findEmployee(empSelect.value), getPayrollFormPeriod, "pr-holiday-section", updatePreview);

  empSelect.addEventListener("change", () => { state.prHolidayEntries.length = 0; holidayCtrl.refresh(); });
  freqSelect.addEventListener("change", () => { toggleFrequencyUI(); holidayCtrl.refresh(); });
  document.getElementById("pr-period-month").addEventListener("change", () => holidayCtrl.refresh());
  document.getElementById("pr-period-start").addEventListener("change", () => { updateRangeDisplay(); holidayCtrl.refresh(); });
  if(reghoursInput) reghoursInput.addEventListener("input", () => { reghoursInput.dataset.touched = "1"; });
  PR_FIELD_IDS.concat(["pr-reghours"]).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", updatePreview);
  });
  toggleFrequencyUI();
  updatePreview();

  document.getElementById("pr-submit").addEventListener("click", () => {
    const employeeId = empSelect.value;
    const emp = findEmployee(employeeId);
    const frequency = getPayrollFormFrequency();
    const periodRaw = getPayrollFormPeriod();
    if(!periodRaw){ toast("Please select a payroll period.", "error"); return; }
    const overlap = findOverlappingPayroll(employeeId, periodRaw, null);
    if(overlap){
      toast(`A payroll record already exists for ${emp.fullName} covering ${periodLabel(overlap.period)}. Choose a period that doesn't overlap.`, "error");
      return;
    }
    const rec = computePayrollRecord(emp, periodRaw, readPayrollForm(), db.settings, frequency);
    rec.id = "PR" + String(db.payrolls.length+1).padStart(4,"0") + Math.floor(Math.random()*90+10);
    db.payrolls.push(rec);
    saveDB(db);
    state.prHolidayEntries = [];
    toast("Payroll record generated.");
    navigate("payrollHistory");
  });
}

  return `
    <div class="calc-row"><span>Pay Frequency</span><span class="tabular">${rec.payFrequency==="biweekly" ? "Bi-Weekly" : "Monthly"}</span></div>
    <div class="calc-row"><span>Basic Salary</span><span class="tabular">${money(rec.basicSalary)}</span></div>

    <div class="calc-row"><span>Other Earnings</span><span class="tabular">${money(rec.allowances+(hasHoliday?0:rec.holidayPay)+rec.bonuses+rec.incentives+rec.otherEarnings)}</span></div>
    <div class="calc-row total"><span>Gross Pay</span><span class="tabular">${money(rec.gross)}</span></div>
    <div class="calc-row" style="margin-top:8px;"><span>SSS (EE ${Math.round(rec.sss.eeRate*100)}% of MSC ${money(rec.sss.msc)})</span><span class="tabular">− ${money(rec.sss.ee)}</span></div>

    <div class="calc-row"><span>Withholding Tax</span><span class="tabular">− ${money(rec.withholdingTax.amount)}</span></div>
    ${rec.unpaidLeaveDeduction ? `<div class="calc-row"><span>Unpaid Leave (${rec.unpaidLeaveDays} day${rec.unpaidLeaveDays===1?"":"s"})</span><span class="tabular">− ${money(rec.unpaidLeaveDeduction)}</span></div>` : ""}
    <div class="calc-row"><span>Other Deductions</span><span class="tabular">− ${money(rec.otherDeductTotal - rec.unpaidLeaveDeduction)}</span></div>
    <div class="calc-row total"><span>Net Pay</span><span class="tabular">${money(rec.net)}</span></div>

}

const EP_FIELD_IDS = ["ep-reghours","ep-othours","ep-nsdhours","ep-allow","ep-bonus","ep-incentive","ep-other","ep-loan","ep-advance","ep-absences","ep-tardiness","ep-undertime","ep-comploan","ep-otherded"];

function readEditPayrollForm(fallbackHolidayPay, employeeId){
  const g = id => Number(document.getElementById(id).value)||0;
  return {
    regularHoursWorked: g("ep-reghours"), otHours: g("ep-othours"), nsdHours: g("ep-nsdhours"),
    allowances: g("ep-allow"), holidayEntries: state.epHolidayEntries,
    holidayPay: state.epHolidayEntries.length ? 0 : (fallbackHolidayPay||0), bonuses: g("ep-bonus"),
    incentives: g("ep-incentive"), otherEarnings: g("ep-other"),
    salaryLoan: g("ep-loan"), cashAdvance: g("ep-advance"), absences: g("ep-absences"),
    tardiness: g("ep-tardiness"), undertime: g("ep-undertime"), companyLoan: g("ep-comploan"),
    otherDeductions: g("ep-otherded"),
    unpaidLeaveDays: employeeId ? unpaidLeaveDaysInPeriod(employeeId, getEditFormPeriod()) : 0
  };
}

function getEditFormFrequency(){
  const el = document.getElementById("ep-frequency");
  return el ? el.value : "monthly";
}
function getEditFormPeriod(){
  if(getEditFormFrequency()==="biweekly"){
    const startVal = document.getElementById("ep-period-start").value;
    return startVal ? biweeklyPeriodFromStart(startVal) : "";
  }
  return document.getElementById("ep-period-month").value;
}

function openEditPayroll(id){
  const p = db.payrolls.find(x=>x.id===id);
  if(p && p.recordType==="13th_month"){ toast("13th month releases can't be edited — delete and release again instead.", "error"); return; }
  const emp = findEmployee(p.employeeId);
  state.editingPayrollId = id;
  // Deep-copy so edits inside the modal don't mutate the saved record until "Save Changes" is confirmed.
  state.epHolidayEntries = (p.holidayEntries||[]).map(e=>({...e}));
  openModal({
    title:"Edit Payroll Record",
    bodyHtml: editPayrollFormHtml(p),
    confirmLabel:"Save Changes",
    onConfirm: () => saveEditedPayroll(p, emp)
  });

  const freqSelect = document.getElementById("ep-frequency");
  const monthlyWrap = document.getElementById("ep-period-monthly-wrap");
  const biweeklyWrap = document.getElementById("ep-period-biweekly-wrap");

  function toggleFrequencyUI(){
    const isBiweekly = freqSelect.value === "biweekly";
    monthlyWrap.style.display = isBiweekly ? "none" : "";
    biweeklyWrap.style.display = isBiweekly ? "" : "none";
    updateRangeDisplay();
  }
  function updateRangeDisplay(){
    if(freqSelect.value !== "biweekly") return;
    const startVal = document.getElementById("ep-period-start").value;
    const disp = document.getElementById("ep-period-range-display");
    disp.textContent = startVal ? "Covers: " + periodLabel(biweeklyPeriodFromStart(startVal)) : "";
  }
  const upd = () => {
    if(!emp) return;
    const period = getEditFormPeriod() || p.period;
    const frequency = getEditFormFrequency();
    const rec = computePayrollRecord(emp, period, readEditPayrollForm(p.holidayPay, emp.id), db.settings, frequency);
    document.getElementById("ep-holiday").value = money(rec.holidayPay);
    document.getElementById("ep-leave").value = rec.unpaidLeaveDays ? `${rec.unpaidLeaveDays} day(s) — ${money(rec.unpaidLeaveDeduction)}` : "None this period";
    document.getElementById("ep-preview").innerHTML = payrollPreviewHtml(rec);
  };
  const holidayCtrl = wireHolidayEntriesBlock("ep", state.epHolidayEntries,
    () => emp, () => getEditFormPeriod() || p.period, "ep-holiday-section", upd);

  EP_FIELD_IDS.forEach(id2=>document.getElementById(id2).addEventListener("input", upd));
  freqSelect.addEventListener("change", () => { toggleFrequencyUI(); holidayCtrl.refresh(); });
  document.getElementById("ep-period-month").addEventListener("change", () => holidayCtrl.refresh());
  document.getElementById("ep-period-start").addEventListener("change", () => { updateRangeDisplay(); holidayCtrl.refresh(); });
  toggleFrequencyUI();
  upd();
}

function saveEditedPayroll(existing, emp){
  const frequency = getEditFormFrequency();
  const period = getEditFormPeriod();
  if(!period){ toast("Please select a payroll period.", "error"); return; }
  const overlap = findOverlappingPayroll(existing.employeeId, period, existing.id);
  if(overlap){
    toast(`Another payroll record already exists covering ${periodLabel(overlap.period)}. Choose a period that doesn't overlap.`, "error");
    return;
  }
  if(!emp){ toast("This employee no longer exists.", "error"); return; }

  const rec = computePayrollRecord(emp, period, readEditPayrollForm(existing.holidayPay, emp.id), db.settings, frequency);
  rec.id = existing.id;
  const idx = db.payrolls.findIndex(p=>p.id===existing.id);
  db.payrolls[idx] = rec;
  saveDB(db);
  toast("Payroll record updated.");
  closeModal();
  render();
}

function recalculatePayroll(id){
  const p = db.payrolls.find(x=>x.id===id);
  if(p && p.recordType==="13th_month"){ toast("13th month releases can't be recalculated — delete and release again instead.", "error"); return; }
  const emp = findEmployee(p.employeeId);
  if(!p || !emp){ toast("Cannot recalculate — employee record not found.", "error"); return; }
  const inputs = { ...p, unpaidLeaveDays: unpaidLeaveDaysInPeriod(emp.id, p.period) };
  const rec = computePayrollRecord(emp, p.period, inputs, db.settings, p.payFrequency);
  rec.id = p.id;
  const idx = db.payrolls.findIndex(x=>x.id===id);
  db.payrolls[idx] = rec;
  saveDB(db);
  toast("Payroll recalculated using current rates.");
  render();
}

function confirmDeletePayroll(id){
  const p = db.payrolls.find(x=>x.id===id);
  const emp = findEmployee(p.employeeId) || {fullName:"this employee"};
  openConfirmModal({
    title:"Delete Payroll Record",
    message: `Delete the ${periodLabel(p.period)} payroll record for ${emp.fullName}? This cannot be undone.`,
    confirmLabel:"Delete",
    danger:true,
    onConfirm: () => {
      db.payrolls = db.payrolls.filter(x=>x.id!==id);
      saveDB(db);
      toast("Payroll record deleted.");
      closeModal();
      render();
    }
  });
}

/* ---------------- EMPLOYEE DASHBOARD ---------------- */
function renderEmployeeDashboard(){
  const emp = findEmployee(state.currentUser.employeeId);
  const records = db.payrolls.filter(p=>p.employeeId===emp.id).sort((a,b)=> periodStart(b.period)-periodStart(a.period));
  const latest = records[0];
  const previous = records[1];
  let netDelta = "";
  if(latest && previous){
    const diff = latest.net - previous.net;
    const pct = previous.net ? (diff/previous.net*100) : 0;
    const arrow = diff === 0 ? "—" : (diff > 0 ? "▲" : "▼");
    netDelta = `<div class="ledger-delta ${diff>=0?'up':'down'}">${arrow} ${Math.abs(pct).toFixed(1)}% vs ${periodLabel(previous.period)}</div>`;
  }

  return `
  <div class="page-head">
    <div><h2>Welcome, ${emp.fullName.split(" ")[0]}</h2><p>${emp.position} · ${emp.department}</p></div>
  </div>
  <div class="stat-grid">
    <div class="ledger-strip">
      <div class="ledger-stat clickable" data-nav="profile">
        <div class="ledger-label">Employment Status</div>
        <div class="ledger-figure" style="font-size:22px;">${emp.status}</div>
        <div class="ledger-sub">${emp.employmentStatus||""}</div>
      </div>
      <div class="ledger-stat clickable" data-nav="myPayroll">
        <div class="ledger-label">Current Net Salary</div>
        <div class="ledger-figure">${latest ? money(latest.net) : "—"}</div>
        ${netDelta || `<div class="ledger-sub">${latest?'':'No payslips yet'}</div>`}
      </div>
      <div class="ledger-stat clickable" data-nav="myPayroll">
        <div class="ledger-label">Latest Payroll Period</div>
        <div class="ledger-figure" style="font-size:22px;">${latest ? periodLabel(latest.period) : "—"}</div>
        <div class="ledger-sub">${db.settings.payDate}</div>
      </div>
    </div>
  </div>
  ${latest ? `<div class="panel"><h3>Latest Payslip</h3>${payslipHtml(latest)}<div class="print-row"><button class="btn btn-secondary btn-sm" data-print-pr="${latest.id}">Print Payslip</button></div></div>` :
    `<div class="panel"><div class="empty-state">No payroll records yet.</div></div>`}
  `;
}

function wireSettingsForm(){
  const saveBtn = document.getElementById("st-save");
  if(!saveBtn) return;

  document.getElementById("st-reset").addEventListener("click", () => {
    openConfirmModal({
      title:"Restore Default Settings",
      message:"This resets company info and all statutory rates to their defaults. Continue?",
      confirmLabel:"Restore Defaults", danger:true,
      onConfirm: () => { db.settings = defaultSettings(); saveDB(db); toast("Settings restored to defaults."); closeModal(); render(); }
    });
  });

  saveBtn.addEventListener("click", () => {
    const g = id => Number(document.getElementById(id).value)||0;
    const s = db.settings;
    s.companyName = document.getElementById("st-company").value.trim() || s.companyName;
    s.companyAddress = document.getElementById("st-address").value.trim();
    s.dailyWorkingHours = g("st-dailyhours") || s.dailyWorkingHours;
    s.workingDaysPerYear = g("st-workdays") || s.workingDaysPerYear;
    s.payrollCutoff = document.getElementById("st-cutoff").value.trim();
    s.payDate = document.getElementById("st-paydate").value.trim();
    s.otMultiplier = g("st-otrate")/100;
    s.nsdRate = g("st-nsdrate")/100;

    s.sss.eeRate = g("st-sss-ee")/100;
    s.sss.erRate = g("st-sss-er")/100;
    s.sss.floorComp = g("st-sss-floor");
    s.sss.ceilingComp = g("st-sss-ceiling");
    s.sss.increment = g("st-sss-incr") || 500;
    s.sss.ec.threshold = g("st-sss-ec-threshold");
    s.sss.ec.lowAmount = g("st-sss-ec-low");
    s.sss.ec.highAmount = g("st-sss-ec-high");
    s.thirteenthMonth.exemptCeiling = g("st-13th-ceiling");

    s.philhealth.rate = g("st-ph-rate")/100;
    s.philhealth.eeShare = g("st-ph-eeshare")/100;
    s.philhealth.floor = g("st-ph-floor");
    s.philhealth.ceiling = g("st-ph-ceiling");

    s.pagibig.eeRateBelow = g("st-pi-eelow")/100;
    s.pagibig.eeRateAbove = g("st-pi-eehigh")/100;
    s.pagibig.thresholdComp = g("st-pi-threshold");
    s.pagibig.erRate = g("st-pi-er")/100;
    s.pagibig.compCeiling = g("st-pi-ceiling");

    s.holidayRates.regularWorked = g("st-hol-regworked")/100;
    s.holidayRates.regularRestDayWorked = g("st-hol-regrest")/100;
    s.holidayRates.regularOtMultiplier = g("st-hol-regot")/100;
    s.holidayRates.specialWorked = g("st-hol-specworked")/100;
    s.holidayRates.specialRestDayWorked = g("st-hol-specrest")/100;
    s.holidayRates.specialOtMultiplier = g("st-hol-specot")/100;
    s.holidayRates.specialWorkingWorked = g("st-hol-workingday")/100;

    const mins = document.querySelectorAll(".bir-min"), maxs = document.querySelectorAll(".bir-max"),
          bases = document.querySelectorAll(".bir-base"), rates = document.querySelectorAll(".bir-rate");
    const table = [];
    mins.forEach((el,i)=>{
      const maxVal = maxs[i].value.trim();
      table.push({
        min: Number(el.value)||0,
        max: maxVal==="" ? null : Number(maxVal),
        base: Number(bases[i].value)||0,
        rate: (Number(rates[i].value)||0)/100
      });
    });
    s.bir.table = table;

    saveDB(db);
    toast("Payroll settings saved.");
    render();
  });
}

let currentModalConfirm = null;

function openModal({title, bodyHtml, confirmLabel, onConfirm, danger}){
  const backdrop = document.getElementById("modal-backdrop");
  const inner = document.getElementById("modal-inner");
  currentModalConfirm = onConfirm || null;
  inner.innerHTML = `
    <div class="modal-head">
      <h3>${title}</h3>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">${bodyHtml}</div>
    ${confirmLabel ? `
    <div class="modal-foot">
      <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modal-confirm-btn">${confirmLabel}</button>
    </div>` : `<div class="modal-foot"><button class="btn btn-secondary" id="modal-cancel-btn">Close</button></div>`}
  `;
  backdrop.classList.add("show");
  document.getElementById("modal-close-btn").addEventListener("click", closeModal);
  document.getElementById("modal-cancel-btn").addEventListener("click", closeModal);
  const confirmBtn = document.getElementById("modal-confirm-btn");
  if(confirmBtn) confirmBtn.addEventListener("click", () => { if(currentModalConfirm) currentModalConfirm(); });

  if(state.view === "employees" || document.getElementById("f-id")){
    // employee modal open — nothing extra needed, form is static
  }
}

function openConfirmModal({title, message, confirmLabel, danger, onConfirm}){
  openModal({
    title, bodyHtml: `<p style="color:var(--ink-soft);">${message}</p>`,
    confirmLabel: confirmLabel || "Confirm", danger, onConfirm
  });
}

function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("show");
  currentModalConfirm = null;
}

/* ---------------- DRAG-TO-SCROLL (cursor swipe) ---------------- */
function enableDragScroll(){
  document.querySelectorAll(".table-wrap").forEach(wrap=>{
    const refreshSwipeable = () => {
      if(wrap.scrollWidth > wrap.clientWidth + 1) wrap.classList.add("swipeable");
      else wrap.classList.remove("swipeable");
    };
    refreshSwipeable();
    window.addEventListener("resize", refreshSwipeable);

    let isDown = false, startX = 0, startScroll = 0, moved = false;

    wrap.addEventListener("mousedown", (e)=>{
      if(!wrap.classList.contains("swipeable")) return;
      isDown = true; moved = false;
      wrap.classList.add("dragging");
      startX = e.pageX;
      startScroll = wrap.scrollLeft;
    });

    const endDrag = () => {
      if(!isDown) return;
      isDown = false;
      wrap.classList.remove("dragging");
    };
    wrap.addEventListener("mouseleave", endDrag);
    wrap.addEventListener("mouseup", endDrag);
    window.addEventListener("mouseup", endDrag);

    wrap.addEventListener("mousemove", (e)=>{
      if(!isDown) return;
      e.preventDefault();
      const delta = e.pageX - startX;
      if(Math.abs(delta) > 3) moved = true;
      wrap.scrollLeft = startScroll - delta;
    });

    // Swallow the click that follows a drag so row buttons/links don't fire accidentally
    wrap.addEventListener("click", (e)=>{
      if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  });
}
